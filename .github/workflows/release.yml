name: Release

# Push a tag like v1.0.1 to publish to npm and create a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "Tag v$TAG does not match package.json $PKG"; exit 1; fi
          SRC=$(node -e "console.log(require('fs').readFileSync('src/version.ts','utf8').match(/'(.+)'/)[1])")
          if [ "$PKG" != "$SRC" ]; then echo "src/version.ts ($SRC) does not match package.json ($PKG)"; exit 1; fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/cli/index.js demo

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          npm pack
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md mandate-protocol-$VERSION.tgz
